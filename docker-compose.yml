version: '3.8'

services:
  # ============ Frontend (React/Vite) ============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: antique-store-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - antique-network

  # ============ Backend API (Node.js) ============
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antique-store-api
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-antique123}
      - DB_NAME=antique_store
      - DB_DIALECT=mysql
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key}
      # Cho phép Frontend truy cập API nội bộ qua Nginx
      - CORS_ORIGIN=https://api.antiquestore.vn,https://antiquestore.vn
    depends_on:
      - db
    networks:
      - antique-network
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs

  # ============ MySQL Database ============
  db:
    image: mysql:8.0
    container_name: antique-store-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-antique123}
      MYSQL_DATABASE: antique_store
    ports:                  
      - "3306:3306"
    networks:
      - antique-network
    volumes:
      - mysql-data:/var/lib/mysql

  # ============ Nginx (Reverse Proxy) ============
  nginx:
    image: nginx:alpine
    container_name: antique-store-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/uploads:/var/www/antiquestore/uploads:ro
      # Uncomment các dòng dưới nếu bạn đã có SSL Certs thực tế
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
    depends_on:
      - frontend
      - api
    networks:
      - antique-network

networks:
  antique-network:
    driver: bridge

volumes:
  mysql-data: